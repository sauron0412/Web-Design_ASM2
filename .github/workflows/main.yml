name: CI-CD Auto Deploy Web 

on:
  push: 
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 1. Lay code moi nhat tu Github
        uses: actions/checkout@v4

      - name: 2. Cap nhat thang ra Nginx Port 80
        run: |
          sudo rm -rf /var/www/html/*
          sudo cp -r "online restaurant"/* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html
          sudo systemctl reload nginx 
          
